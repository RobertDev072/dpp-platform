<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Postkaart</title>
<style>
@font-face { font-family: 'Host Grotesk'; font-weight: 300 800; src: url(https://fonts.gstatic.com/s/hostgrotesk/v5/co3BmWBnlCJ3U42vbbfdwMjZpFjm.woff2) format('woff2'); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1350px; overflow: hidden; }
body { font-family: 'Host Grotesk', Arial, sans-serif; color: #fff; background: #06162a; }
.card { position: relative; width: 1080px; height: 1350px; padding: 96px 88px; display: flex; flex-direction: column; overflow: hidden;
  background: radial-gradient(120% 90% at 90% 0%, #1b5bb8 0%, #0a2342 45%, #06162a 100%); }
.card::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px); background-size: 72px 72px; mask-image: radial-gradient(80% 70% at 70% 30%, #000, transparent); }
.blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; }
.b1 { width: 620px; height: 620px; right: -200px; top: -160px; background: #1476ff; }
.b2 { width: 520px; height: 520px; left: -220px; bottom: -200px; background: #72e600; opacity: .28; }
.top { position: relative; display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 16px; font-size: 38px; font-weight: 650; letter-spacing: -.02em; }
.brand svg { width: 64px; height: 64px; }
.kicker { display: inline-flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 650; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.85); }
.kicker::before { content: ""; width: 16px; height: 16px; border-radius: 50%; background: #72e600; box-shadow: 0 0 24px #72e600; }
.main { position: relative; margin-top: auto; margin-bottom: auto; }
h1 { margin-top: 36px; font-size: 104px; line-height: .98; font-weight: 650; letter-spacing: -.045em; text-wrap: balance; }
.sub { margin-top: 40px; font-size: 40px; line-height: 1.3; color: rgba(255,255,255,.78); text-wrap: balance; max-width: 880px; }
.foot { position: relative; display: flex; align-items: center; justify-content: space-between; font-size: 30px; font-weight: 600; color: rgba(255,255,255,.75); }
.pill { background: #72e600; color: #06162a; border-radius: 999px; padding: 18px 34px; font-weight: 700; }

/* varianten */
.countdown h1 { font-size: 150px; color: #72e600; text-shadow: 0 0 60px rgba(114,230,0,.35); }
.myth h1 { font-size: 80px; font-style: italic; font-weight: 550; }
.myth .sub { display: inline-block; margin-top: 44px; padding: 22px 32px; border-radius: 28px; background: rgba(114,230,0,.14); border: 2px solid rgba(114,230,0,.6); color: #fff; font-weight: 600; }
.myth .sub::before { content: "✓ "; color: #72e600; }
.question h1 { font-size: 92px; }
.question .sub { display: inline-block; padding: 22px 32px; border-radius: 28px; background: #fff; color: #06162a; font-weight: 650; font-size: 34px; }
.list .sub, .timeline .sub { font-size: 0; margin-top: 44px; display: grid; gap: 14px; }
.list .sub span, .timeline .sub span { font-size: 36px; display: flex; align-items: center; gap: 22px; padding: 18px 26px; border-radius: 24px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); color: #fff; font-weight: 550; }
.list .sub span b, .timeline .sub span b { display: inline-grid; place-items: center; min-width: 54px; height: 54px; border-radius: 16px; background: #72e600; color: #06162a; font-size: 28px; }
.list h1, .timeline h1 { font-size: 84px; }
.founder { background: radial-gradient(120% 90% at 10% 0%, #0f6b5a 0%, #0a2342 50%, #06162a 100%); }
.tip h1 { font-size: 96px; }
.tip .kicker::before { content: "💡"; width: auto; height: auto; background: none; box-shadow: none; font-size: 30px; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="top">
    <div class="brand"><svg viewBox="0 0 280 280"><path fill="#72E600" d="M34 42C20 52 18 72 27 91l78 145c8 15 29 16 38 1l24-42-68-132C85 36 55 27 34 42Z"/><path fill="#1476FF" d="M222 38c21-9 40 10 35 32l-31 142c-3 14-12 26-25 33l-59 31c-14 7-30-4-26-20l49-181c7-18 31-30 57-37Z"/><path fill="#FFFFFF" d="M174 91h47c7 0 12 5 12 12s-5 12-12 12h-47c-7 0-12-5-12-12s5-12 12-12Zm-10 45h48c7 0 12 5 12 12s-5 12-12 12h-48c-7 0-12-5-12-12s5-12 12-12Z"/></svg>VeriPasso</div>
  </div>
  <div class="main">
    <p class="kicker" id="kicker"></p>
    <h1 id="headline"></h1>
    <p class="sub" id="sub"></p>
  </div>
  <div class="foot"><span>www.veripasso.com</span><span class="pill" id="cta">Doe de DPP-check</span></div>
</div>
<script>
// Vult de kaart met post nummer ?i= uit posts.json.
(async () => {
  const i = Number(new URLSearchParams(location.search).get('i') || 0);
  const post = (await (await fetch('posts.json')).json())[i];
  const card = document.getElementById('card');
  card.classList.add(post.style);
  document.getElementById('kicker').textContent = post.kicker;
  document.getElementById('headline').textContent = post.headline;
  const sub = document.getElementById('sub');
  if (post.style === 'list' || post.style === 'timeline') {
    post.sub.split(' · ').forEach((part, n) => {
      const s = document.createElement('span'); const b = document.createElement('b');
      b.textContent = n + 1; s.append(b, part); sub.append(s);
    });
  } else sub.textContent = post.sub;
  const link = post.link || '';
  document.getElementById('cta').textContent = link.includes('/dpp-check') ? 'Doe de DPP-check' : link.includes('/blog') ? 'Lees op de blog' : link.includes('#start') ? 'Vraag een demo aan' : 'Ontdek VeriPasso';
  await document.fonts.ready;
  window.cardReady = true;
})();
</script>
</body>
</html>
