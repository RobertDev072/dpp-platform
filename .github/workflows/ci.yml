# Controle bij elke push en pull request:
# 1. app: lockfile installeren, migraties + volledige testsuite tegen een tijdelijke
#    PostgreSQL 17 (nooit tegen productie), productiebuild, kwetsbare afhankelijkheden;
# 2. server: het Docker-image bouwen en de serveropzet (deploy/compose.yaml: app +
#    database) echt starten; slaagt pas als de app gezond is en de pagina's laden;
# 3. deploy: alleen bij een push naar main en als 1 en 2 groen zijn: de live server
#    bijwerken met deploy/update.sh (zie docs/automatisch-deployen.md). Zonder de
#    geheimen DEPLOY_SSH_KEY en DEPLOY_KNOWN_HOSTS slaat deze stap zichzelf over.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      COOKIE_SECRET: ci-only-not-a-secret
      # Maximale databasegrootte; de monitoringtest controleert de capaciteitsmeter.
      DATABASE_MAX_BYTES: "21474836480"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm

      - run: npm ci

      - name: Migraties
        run: npm run migrate

      - name: Tests
        run: npm test
        env:
          # Zelfde als lokaal: sessiecookie zonder secure-vlag (testserver draait op http).
          NODE_ENV: development

      - name: Productiebuild
        run: npm run build

      - name: Afhankelijkheden controleren (hoog/kritiek)
        run: npm audit --omit=dev --audit-level=high

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v4

      - name: Testconfiguratie (geen echte geheimen)
        run: |
          cat > .env <<'EOF'
          POSTGRES_PASSWORD=ci-only-db-password
          COOKIE_SECRET=ci-only-cookie-secret
          MFA_ENCRYPTION_KEY=ci-only-mfa-key
          APP_BASE_URL=http://localhost
          QR_BASE_URL=http://localhost
          DATABASE_MAX_BYTES=21474836480
          EOF

      - name: Image bouwen en app + database starten
        run: docker compose up -d --build --wait --wait-timeout 300 db app
        env:
          GIT_SHA: ${{ github.sha }}

      - name: Rooktest in de container
        run: |
          docker compose exec -T app node -e "
            (async () => {
              for (const path of ['/api/health', '/api/health/ready', '/', '/login', '/blog', '/en/blog', '/dpp-check', '/sitemap.xml']) {
                const r = await fetch('http://127.0.0.1:3000' + path);
                console.log(path, r.status);
                if (!r.ok) process.exit(1);
              }
            })().catch((e) => { console.error(e); process.exit(1); });
          "

      - name: Migraties toegepast
        run: docker compose exec -T db psql -U veripasso -d veripasso -tAc "SELECT count(*) FROM dbo.schemamigrations" | grep -E '^[1-9]'

      - name: Logs bij een fout
        if: failure()
        run: docker compose logs --tail=200

  deploy:
    needs: [app, server]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Nooit twee uitrols tegelijk; een nieuwere wacht op de lopende.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Server bijwerken (update.sh maakt eerst een back-up)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "Geen deploy-sleutel ingesteld: automatisch uitrollen overgeslagen."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Op de server mag deze sleutel alleen update.sh starten (command= in authorized_keys).
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes root@158.180.35.95

      - name: Live controle
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          [ -n "$DEPLOY_SSH_KEY" ] || exit 0
          for url in https://www.veripasso.com/ https://www.veripasso.com/blog https://www.veripasso.com/dpp-check https://app.veripasso.com/api/health; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url")
            echo "$url $code"
            [ "$code" = "200" ] || exit 1
          done
