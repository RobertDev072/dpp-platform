# AWS pauzeren of hervatten - ALLEEN HANDMATIG. Bespaart kosten tijdens ontwikkelen.
#
# Pauzeren:  de app-functie (Lambda) op gelijktijdigheid 0 (alle verzoeken worden
#            geweigerd; CloudFront toont een foutpagina) en de database gestopt.
#            Kosten die doorlopen: opslag (database, S3, back-ups) en Secrets Manager.
# Hervatten: database starten, wachten tot beschikbaar, de app weer vrijgeven.
#
# Een draaiende Lambda zonder verkeer kost niets; de besparing zit in de database.
# Let op: AWS start een gestopte database na 7 dagen automatisch weer op. Hervat de
# omgeving vóór een uitrol (Deploy naar AWS), anders mislukken de migraties.

name: AWS pauzeren / hervatten

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Omgeving"
        required: true
        type: choice
        options: [production, staging]
      action:
        description: "Actie"
        required: true
        type: choice
        options: [pauzeren, hervatten]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  pause:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ${{ inputs.environment }}
    env:
      ENV_NAME: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Configuratie lezen
        id: cfg
        run: echo "region=$(jq -r .region infra/config/$ENV_NAME.json)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ steps.cfg.outputs.region }}

      - name: Resources opzoeken
        id: res
        run: |
          set -euo pipefail
          STACK="VeriPasso-$ENV_NAME-App"
          out() { aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          echo "fn=$(out FunctionName)" >> "$GITHUB_OUTPUT"
          DB_HOST=$(out DbEndpoint)
          echo "db=${DB_HOST%%.*}" >> "$GITHUB_OUTPUT"

      - name: Pauzeren
        if: inputs.action == 'pauzeren'
        env:
          FN: ${{ steps.res.outputs.fn }}
          DB: ${{ steps.res.outputs.db }}
        run: |
          set -euo pipefail
          if [ -n "$FN" ] && [ "$FN" != "None" ]; then
            aws lambda put-function-concurrency --function-name "$FN" --reserved-concurrent-executions 0
          fi
          STATUS=$(aws rds describe-db-instances --db-instance-identifier "$DB" --query 'DBInstances[0].DBInstanceStatus' --output text)
          echo "Database-status: $STATUS"
          if [ "$STATUS" = "available" ]; then
            aws rds stop-db-instance --db-instance-identifier "$DB" --query 'DBInstance.DBInstanceStatus' --output text
          fi
          echo "Gepauzeerd. Hervat met deze workflow (actie: hervatten)."

      - name: Hervatten
        if: inputs.action == 'hervatten'
        env:
          FN: ${{ steps.res.outputs.fn }}
          DB: ${{ steps.res.outputs.db }}
        run: |
          set -euo pipefail
          STATUS=$(aws rds describe-db-instances --db-instance-identifier "$DB" --query 'DBInstances[0].DBInstanceStatus' --output text)
          echo "Database-status: $STATUS"
          if [ "$STATUS" = "stopping" ]; then
            aws rds wait db-instance-stopped --db-instance-identifier "$DB" || true
            STATUS=stopped
          fi
          if [ "$STATUS" = "stopped" ]; then
            aws rds start-db-instance --db-instance-identifier "$DB" --query 'DBInstance.DBInstanceStatus' --output text
          fi
          aws rds wait db-instance-available --db-instance-identifier "$DB"
          # Bestaat de functie nog niet (omgeving nog van vóór de overstap naar Lambda),
          # dan maakt de volgende uitrol hem aan.
          if [ -n "$FN" ] && [ "$FN" != "None" ]; then
            # De limiet uit de configuratie (lambdaReservedConcurrency) zet de uitrol
            # terug; zonder limiet de pauze-instelling verwijderen.
            LIMIT=$(jq -r '.lambdaReservedConcurrency // empty' infra/config/$ENV_NAME.json)
            if [ -n "$LIMIT" ]; then
              aws lambda put-function-concurrency --function-name "$FN" --reserved-concurrent-executions "$LIMIT"
            else
              aws lambda delete-function-concurrency --function-name "$FN"
            fi
          fi
          echo "Hervat: database beschikbaar, app vrijgegeven."
