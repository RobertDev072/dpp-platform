# Uitrol naar AWS - ALLEEN HANDMATIG (workflow_dispatch). Er is bewust geen
# automatische trigger: elke uitrol is een expliciete beslissing.
#
# Eenmalig instellen (zie docs/aws-deployment-runbook.md):
# - AWS: CDK bootstrap + de CI-stack (OIDC-rol, alleen voor deze repository én de
#   GitHub-environment met dezelfde naam). Geen AWS-sleutels in GitHub.
# - GitHub-variabele ALARM_EMAILS (kommagescheiden) voor alarmen en budgetmeldingen.
# - GitHub: environment "production" (en/of "staging") met variabele
#   AWS_DEPLOY_ROLE_ARN; optioneel secrets SYSTEM_OWNER_EMAIL/PASSWORD/FIRST_NAME/
#   LAST_NAME voor het eenmalig aanmaken van de Platform Owner.
#
# Volgorde: registry-stack → image bouwen en pushen → app-stack met de nieuwe
# image-tag (Lambda) → databasemigraties en versie-aanvulling via een directe aanroep
# van de functie (geen extra infrastructuur). Migraties zijn altijd additief, zodat de
# korte periode tussen nieuwe code en nieuw schema veilig is. Faalt de stack-update,
# dan rolt CloudFormation automatisch terug naar de vorige versie.
#
# De database moet draaien (na een pauze eerst "AWS pauzeren / hervatten" → hervatten).

name: Deploy naar AWS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Omgeving"
        required: true
        type: choice
        options: [production, staging]
      seed_owner:
        description: "Platform Owner aanmaken/bijwerken (eenmalig; gebruikt de SYSTEM_OWNER_*-secrets)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    env:
      ENV_NAME: ${{ inputs.environment }}
      IMAGE_TAG: ${{ github.sha }}
      # Alarm-/budgetadressen: GitHub-environmentvariabele, niet in de openbare repo.
      ALARM_EMAILS: ${{ vars.ALARM_EMAILS }}
    steps:
      - uses: actions/checkout@v4

      - name: Configuratie lezen
        id: cfg
        run: |
          echo "region=$(jq -r .region infra/config/$ENV_NAME.json)" >> "$GITHUB_OUTPUT"
          echo "platform=$(jq -r 'if .cpuArchitecture == "ARM64" then "linux/arm64" else "linux/amd64" end' infra/config/$ENV_NAME.json)" >> "$GITHUB_OUTPUT"
          # Edge-stack (us-east-1) alleen als WAF aan staat en er nog geen bestaande web-ACL is opgegeven.
          echo "waf=$(jq -r 'if .enableWaf and (.webAclArn // "") == "" then "true" else "false" end' infra/config/$ENV_NAME.json)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ steps.cfg.outputs.region }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: CDK installeren
        working-directory: infra
        run: npm ci

      - name: Container-register (ECR) uitrollen
        working-directory: infra
        run: npx cdk deploy "VeriPasso-$ENV_NAME-Registry" -c env=$ENV_NAME --require-approval never

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-qemu-action@v3
        if: steps.cfg.outputs.platform == 'linux/arm64'

      - uses: docker/setup-buildx-action@v3

      - name: Image bouwen en pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ steps.ecr.outputs.registry }}/veripasso-${{ inputs.environment }}-app:${{ github.sha }}
          # Lambda accepteert alleen een enkelvoudig image-manifest (geen attestations).
          provenance: false
          sbom: false
          platforms: ${{ steps.cfg.outputs.platform }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Uitrollen (CDK)
        working-directory: infra
        run: |
          # Ook de CI-stack (rechten van deze deployrol), zodat nieuwe rechten direct gelden.
          STACKS="VeriPasso-$ENV_NAME-Ci VeriPasso-$ENV_NAME-App"
          if [ "${{ steps.cfg.outputs.waf }}" = "true" ]; then STACKS="VeriPasso-$ENV_NAME-Edge $STACKS"; fi
          npx cdk deploy $STACKS -c env=$ENV_NAME -c imageTag=$IMAGE_TAG --require-approval never

      - name: Hulpfunctie voor interne taken
        run: |
          cat > run-task.sh <<'EOF'
          #!/usr/bin/env bash
          # Gebruik: run-task.sh <payload-json>
          # Directe aanroep van de app-functie (IAM-rechten vereist; niet via internet
          # bereikbaar). De Lambda Web Adapter stuurt de payload als POST naar
          # /api/internal/events; het antwoord komt terug in out.json.
          set -euo pipefail
          FN=$(aws cloudformation describe-stacks --stack-name "VeriPasso-$ENV_NAME-App" --query "Stacks[0].Outputs[?OutputKey=='FunctionName'].OutputValue" --output text)
          aws lambda wait function-updated-v2 --function-name "$FN"
          printf '%s' "$1" > payload.json
          aws lambda invoke --function-name "$FN" --cli-binary-format raw-in-base64-out --cli-read-timeout 900 \
            --payload file://payload.json out.json --query 'FunctionError' --output text | grep -qv Unhandled
          rm -f payload.json
          # Alleen de taaknaam en het resultaat tonen (nooit de payload: die kan een wachtwoord bevatten).
          jq -c '{ok, task, result, error}' out.json 2>/dev/null || cat out.json
          jq -e '.ok == true' out.json >/dev/null
          EOF
          chmod +x run-task.sh

      - name: Databasemigraties
        run: ./run-task.sh '{"task":"migrate"}'

      - name: Paspoortversies aanvullen
        run: ./run-task.sh '{"task":"backfill"}'

      - name: Platform Owner aanmaken (optioneel)
        if: inputs.seed_owner
        env:
          OWNER_EMAIL: ${{ secrets.SYSTEM_OWNER_EMAIL }}
          OWNER_PASSWORD: ${{ secrets.SYSTEM_OWNER_PASSWORD }}
          OWNER_FIRST: ${{ secrets.SYSTEM_OWNER_FIRST_NAME }}
          OWNER_LAST: ${{ secrets.SYSTEM_OWNER_LAST_NAME }}
        run: |
          set -euo pipefail
          test -n "$OWNER_EMAIL" && test -n "$OWNER_PASSWORD" || { echo "SYSTEM_OWNER_EMAIL/PASSWORD ontbreken als environment-secret"; exit 1; }
          PAYLOAD=$(jq -cn --arg e "$OWNER_EMAIL" --arg p "$OWNER_PASSWORD" --arg f "${OWNER_FIRST:-Platform}" --arg l "${OWNER_LAST:-Owner}" \
            '{task:"seed-owner",email:$e,password:$p,firstName:$f,lastName:$l}')
          ./run-task.sh "$PAYLOAD"

      - name: Rooktest
        run: |
          set -euo pipefail
          APP=$(jq -r .appDomain infra/config/$ENV_NAME.json)
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://$APP/api/health" || true)
            echo "https://$APP/api/health -> $CODE"
            [ "$CODE" = "200" ] && exit 0
            sleep 10
          done
          exit 1

      - name: Adressen
        run: |
          aws cloudformation describe-stacks --stack-name "VeriPasso-$ENV_NAME-App" \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDomain' || OutputKey=='FunctionName'].[OutputKey,OutputValue]" --output table
