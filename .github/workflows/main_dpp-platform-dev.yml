# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - dpp-platform-dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      # De testsuite (tests/) heeft een SQL Server-database nodig en draait (nog) niet hier.
      # Lokaal draait hij tegen een SQL Server-container, zie README "Tests"; draai npm test
      # vóór elke push. Zonder timeout-minutes hierboven zou een verbindingspoging zonder
      # DB-credentials tot 6 uur kunnen blijven hangen i.p.v. snel falen.
      - name: npm install and build
        run: |
          npm install
          npm run build --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B46AE3B10F5341C8B3BD1807671183D5 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EC8DCA4F35AE4CCFB235E2F89E942F66 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C7969EB9ED5842B3B86EEA44AB000568 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'dpp-platform-dev'
          slot-name: 'Production'
          package: .
          