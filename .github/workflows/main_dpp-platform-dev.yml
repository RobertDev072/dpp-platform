# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - dpp-platform-dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      # De testsuite (tests/) heeft een live Azure SQL-verbinding nodig en draait bewust
      # niet hier: die DB-secrets staan niet in GitHub Actions. Tests draaien lokaal
      # (npm test) vóór elke push. Zonder timeout-minutes hierboven zou een verbindings-
      # poging zonder DB-credentials tot 6 uur kunnen blijven hangen i.p.v. snel falen.
      #
      # Dit is bewust alleen een BUILD-VALIDATIE (fail-fast als de Next.js-build breekt),
      # geen artefact dat naar Azure gaat. Azure App Service (Linux) comprimeert
      # node_modules bij elke deploy automatisch naar node_modules.tar.gz en genereert
      # daarbij oryx-manifest.toml (platform-eigen optimalisatie, gedocumenteerd op
      # https://azure.github.io/AppService/2025/07/09/node-optimization.html) - als wij
      # zelf een kant-en-klare node_modules/.next meesturen vanuit deze ubuntu-runner,
      # botst dat met die platform-optimalisatie en verdwijnt .next (vandaar de eerdere
      # "Could not find a production build in the '.next' directory"-fout op Azure).
      # In plaats daarvan sturen we alleen broncode; Azure (Oryx, via de
      # SCM_DO_BUILD_DURING_DEPLOYMENT=true App Setting) bouwt zelf npm install +
      # npm run build, in exact dezelfde omgeving als waar de app ook draait.
      - name: npm install and build (validatie, wordt niet gedeployed)
        run: |
          npm install
          npm run build --if-present

      - name: Verwijder build-artefacten vóór upload (Azure bouwt zelf via Oryx)
        run: rm -rf node_modules web/.next web/node_modules

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    # Was 10: Oryx bouwt de app nu zelf op Azure (npm install + next build) in plaats
    # van een kant-en-klaar pakket te ontvangen, en kwam al een keer boven de 10
    # minuten uit (build #17 werd afgebroken). Ruimer gezet zodat een normale, iets
    # tragere build niet halverwege wordt gekilld.
    timeout-minutes: 20
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B46AE3B10F5341C8B3BD1807671183D5 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EC8DCA4F35AE4CCFB235E2F89E942F66 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C7969EB9ED5842B3B86EEA44AB000568 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'dpp-platform-dev'
          slot-name: 'Production'
          package: .
          