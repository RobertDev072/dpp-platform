# UITGEFASEERD - VeriPasso draait niet meer op Azure App Service.
# Deploys lopen nu via de Git-koppeling van Vercel (push naar main = productie,
# andere branches = preview). Deze workflow draait daarom niet meer automatisch;
# het bestand kan verwijderd worden, net als de AZUREAPPSERVICE_*-secrets in GitHub.

name: (uitgefaseerd) Azure Web App deploy

on:
  workflow_dispatch:

jobs:
  uitgefaseerd:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Uitgefaseerd - deploy gaat via Vercel." && exit 1
