<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <title>Account activeren — DPP Platform</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="login-box">
      <h1>DPP Platform</h1>
      <div id="intro"></div>
      <form id="activate-form" class="hidden">
        <label id="password-field" class="hidden">
          Kies een wachtwoord (min. 12 tekens)
          <input type="password" id="password" minlength="12" />
        </label>
        <p class="error hidden" id="error"></p>
        <button type="submit">Account activeren</button>
      </form>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/activate.js"></script>
  </body>
</html>
