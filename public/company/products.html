<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <title>Producten — DPP Platform</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header>
      <nav id="nav-links"></nav>
      <div>
        <span id="whoami"></span>
        <button id="logout-btn">Uitloggen</button>
      </div>
    </header>
    <main>
      <h1>Producten</h1>
      <p class="error hidden" id="error"></p>

      <form class="card" id="create-form">
        <h2>Nieuw product</h2>
        <label>Naam <input id="name" required /></label>
        <label>Merk <input id="brand" /></label>
        <label>Model <input id="model" /></label>
        <label>SKU <input id="sku" /></label>
        <button type="submit">Aanmaken</button>
      </form>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Naam</th>
            <th>Merk</th>
            <th>Model</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </main>
    <script src="/js/api.js"></script>
    <script src="/js/nav.js"></script>
    <script>
      const NAV_MENU = COMPANY_MENU;
    </script>
    <script src="/js/products.js"></script>
  </body>
</html>
