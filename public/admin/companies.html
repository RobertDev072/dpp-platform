<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <title>Bedrijven — DPP Platform</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="/admin/index.html">Dashboard</a>
        <a href="/admin/companies.html">Bedrijven</a>
        <a href="/admin/users.html">Gebruikers</a>
        <a href="/admin/products.html">Producten</a>
      </nav>
      <div>
        <span id="whoami"></span>
        <button id="logout-btn">Uitloggen</button>
      </div>
    </header>
    <main>
      <h1>Bedrijven</h1>
      <p class="error hidden" id="error"></p>

      <form class="card" id="create-form">
        <h2>Nieuw bedrijf</h2>
        <label>Naam <input id="name" required /></label>
        <label>Slug <input id="slug" placeholder="bijv. acme-manufacturing" required /></label>
        <button type="submit">Aanmaken</button>
      </form>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Naam</th>
            <th>Slug</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </main>
    <script src="/js/api.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/companies.js"></script>
  </body>
</html>
